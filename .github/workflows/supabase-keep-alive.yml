name: Supabase Keep Alive

on:
  schedule:
    # Runs twice every day (every 12 hours) to ensure active status
    - cron: "0 */12 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API & Keep-Alive
        env:
          SECRET_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Use GitHub secret if set, else fallback to project default credentials
          SUPABASE_URL="${SECRET_URL:-https://fjwwkjtfwlomvuqpochk.supabase.co}"
          SUPABASE_ANON_KEY="${SECRET_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqd3dranRmd2xvbXZ1cXBvY2hrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxODk0NzcsImV4cCI6MjA4Mzc2NTQ3N30.9ZWpneOBq84flxmTv1td3Y0EfA-WvMIskWaI4ux_ccc}"

          echo "Pinging Supabase REST API at ${SUPABASE_URL}..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/departments?select=id&limit=1" \
               -H "apikey: ${SUPABASE_ANON_KEY}" \
               -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 204 ]; then
            echo "Successfully pinged Supabase REST API. Database is active and warm."
          else
            echo "Warning: Received HTTP status $HTTP_STATUS, retrying root health endpoint..."
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SUPABASE_URL}/rest/v1/" \
                 -H "apikey: ${SUPABASE_ANON_KEY}")
            echo "Health check status: $HEALTH_STATUS"
            if [ "$HEALTH_STATUS" -ge 200 ] && [ "$HEALTH_STATUS" -lt 500 ]; then
              echo "Supabase endpoint is reachable and acknowledged activity."
            else
              echo "Error: Supabase ping failed with status $HEALTH_STATUS"
              exit 1
            fi
          fi

